<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Разложи по стопкам: шаговое напряжение</title>
<style>
  :root{
    --brand:#007760; --brand-dark:#005c49; --brand-soft:#e3f0ec;
    --ink:#182420; --muted:#5d6b66; --paper:#f5f7f6; --card:#fff; --line:#dde5e2;
    --safe:#007760; --safe-soft:#e3f0ec; --danger:#d64545; --danger-soft:#fbe7e7;
    --shadow:0 2px 10px rgba(16,40,33,.08); --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.5;padding:20px}
  .wrap{max-width:720px;margin:0 auto}

  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:0 0 6px}
  h1{font-size:clamp(20px,3.2vw,26px);line-height:1.18;margin:0 0 8px;letter-spacing:-.01em}
  .lead{margin:0;color:var(--muted);font-size:15px}

  .score{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
  .score .n{font-weight:800;font-size:18px}
  .score .n b{color:var(--brand)}
  .bar{flex:1;height:7px;background:var(--brand-soft);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-dark));transition:width .4s cubic-bezier(.2,.7,.2,1)}
  .counter{font-size:13px;color:var(--muted);white-space:nowrap}

  /* card */
  .deck{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:12px}
  .prompt{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
  .action{font-size:20px;font-weight:700;line-height:1.3;min-height:56px;display:flex;align-items:center}
  @media (max-width:560px){.action{font-size:18px}}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .choice{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:11px;padding:13px 10px;border:2px solid;background:#fff;transition:transform .05s,background .15s}
  .choice:active{transform:translateY(1px)}
  .choice.ok{color:var(--safe);border-color:var(--safe)}
  .choice.ok:hover{background:var(--safe-soft)}
  .choice.bad{color:var(--danger);border-color:var(--danger)}
  .choice.bad:hover{background:var(--danger-soft)}
  .choice:disabled{opacity:.45;cursor:default}

  .feedback{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:14px;display:none}
  .feedback.show{display:block}
  .feedback.right{background:var(--safe-soft);border:1px solid var(--safe)}
  .feedback.wrong{background:var(--danger-soft);border:1px solid var(--danger)}
  .feedback .verdict{font-weight:700}
  .feedback.right .verdict{color:var(--safe)}
  .feedback.wrong .verdict{color:var(--danger)}
  .feedback .why{color:var(--ink);margin-top:3px}

  .next{margin-top:14px;display:none}
  .next.show{display:block}
  .btn{font:inherit;font-weight:600;font-size:15px;cursor:pointer;border-radius:10px;padding:11px 20px;border:1px solid var(--brand);background:var(--brand);color:#fff}
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:transparent;color:var(--brand)}
  .btn.ghost:hover{background:var(--brand-soft)}

  /* stacks */
  .stacks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  @media (max-width:560px){.stacks{grid-template-columns:1fr}}
  .stack{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stack h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
  .stack.s-ok h2{color:var(--safe)}
  .stack.s-bad h2{color:var(--danger)}
  .stack .items{display:flex;flex-direction:column;gap:6px;min-height:24px}
  .item{font-size:13px;padding:7px 9px;border-radius:8px;background:var(--paper);display:flex;gap:7px;align-items:flex-start;animation:drop .25s ease-out}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .item .mk{flex:0 0 auto;font-weight:800}
  .item.correct .mk{color:var(--safe)}
  .item.miss .mk{color:var(--danger)}

  /* done */
  .done{display:none;margin-top:16px;border-radius:var(--radius);border:1px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),#fff);padding:18px 20px;box-shadow:var(--shadow)}
  .done.show{display:block}
  .done h3{margin:0 0 6px;font-size:18px}
  .done p{margin:0 0 12px;color:var(--muted);font-size:14px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Урок 4 · Практикум</p>
  <h1>Разложи по стопкам: как вести себя в зоне шагового напряжения</h1>
  <p class="lead">Рядом упал провод под напряжением, вы в опасной зоне. Для каждого действия решите: так <b>правильно</b> или так <b>опасно</b>.</p>

  <div class="score">
    <div class="n"><b id="ok">0</b> верно</div>
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="counter" id="counter">1 / 6</div>
  </div>

  <div class="deck" id="deck">
    <p class="prompt">Действие</p>
    <div class="action" id="action">—</div>
    <div class="choices">
      <button class="choice ok"  id="btnOk"  type="button">✓ Правильно</button>
      <button class="choice bad" id="btnBad" type="button">✕ Опасно</button>
    </div>
    <div class="feedback" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="why" id="why"></div>
    </div>
    <div class="next" id="next"><button class="btn" id="btnNext" type="button">Далее →</button></div>
  </div>

  <div class="stacks">
    <div class="stack s-ok"><h2>✓ Правильно</h2><div class="items" id="stackOk"></div></div>
    <div class="stack s-bad"><h2>✕ Опасно</h2><div class="items" id="stackBad"></div></div>
  </div>

  <div class="done" id="done">
    <h3 id="doneTitle">Готово!</h3>
    <p id="doneText"></p>
    <button class="btn ghost" id="btnReset" type="button">Пройти заново</button>
  </div>
</div>

<script>
const CARDS = [
  { t:"Выходить из зоны «гусиным шагом», ступни вместе", safe:true,
    why:"Малый шаг – почти нет разности потенциалов между ногами." },
  { t:"Не подходить к упавшему проводу ближе 8 метров", safe:true,
    why:"Опасная зона – не менее 8 м (до 20 м на открытой местности при высоком напряжении)." },
  { t:"Предупредить окружающих и вызвать аварийную службу", safe:true,
    why:"Так вы защищаете других, а помощь придёт быстрее." },
  { t:"Идти из зоны широкими шагами", safe:false,
    why:"Широкий шаг увеличивает разность потенциалов между ногами." },
  { t:"Перешагнуть через лежащий провод", safe:false,
    why:"Ноги окажутся в точках с большой разностью потенциалов – прямое поражение." },
  { t:"Броситься к пострадавшему, не глядя под ноги", safe:false,
    why:"Сами попадёте под шаговое напряжение – будет второй пострадавший." },
];

let order=[], i=0, ok=0, answered=false;
const $=id=>document.getElementById(id);

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

function start(){
  order=shuffle([...Array(CARDS.length).keys()]);
  i=0; ok=0; answered=false;
  $('ok').textContent=0; $('bar').style.width='0%';
  $('stackOk').innerHTML=''; $('stackBad').innerHTML='';
  $('done').classList.remove('show'); $('deck').style.display='';
  render();
}

function render(){
  answered=false;
  const c=CARDS[order[i]];
  $('action').textContent=c.t;
  $('counter').textContent=(i+1)+' / '+CARDS.length;
  $('feedback').className='feedback'; $('next').classList.remove('show');
  $('btnOk').disabled=false; $('btnBad').disabled=false;
}

function answer(userSafe){
  if(answered) return; answered=true;
  const c=CARDS[order[i]];
  const right=(userSafe===c.safe);
  if(right) ok++;
  $('ok').textContent=ok;
  $('bar').style.width=((i+1)/CARDS.length*100)+'%';

  // feedback
  const fb=$('feedback');
  fb.classList.add('show', right?'right':'wrong');
  $('verdict').textContent = right ? 'Верно' : 'Ошибка';
  $('why').textContent = (c.safe?'Это правильное действие. ':'Это опасное действие. ') + c.why;

  // drop card into its TRUE stack, marked by whether user was right
  const bin = c.safe ? $('stackOk') : $('stackBad');
  const el=document.createElement('div');
  el.className='item '+(right?'correct':'miss');
  el.innerHTML='<span class="mk">'+(right?'✓':'✕')+'</span><span>'+c.t+'</span>';
  bin.appendChild(el);

  $('btnOk').disabled=true; $('btnBad').disabled=true;
  $('next').classList.add('show');
  $('btnNext').textContent = (i===CARDS.length-1) ? 'Итог →' : 'Далее →';
}

function next(){
  if(i<CARDS.length-1){ i++; render(); }
  else finish();
}

function finish(){
  $('deck').style.display='none';
  const d=$('done'); d.classList.add('show');
  const pct=Math.round(ok/CARDS.length*100);
  $('doneTitle').textContent = 'Готово! Верно '+ok+' из '+CARDS.length;
  let msg;
  if(ok===CARDS.length) msg='Отлично — из зоны шагового напряжения вы выйдете правильно. Главное правило: мелкий шаг, не отрывая одну ступню от другой и от земли, никаких широких шагов и бега.';
  else if(pct>=60) msg='Неплохо. Ещё раз: чем меньше расстояние между ногами, тем безопаснее – «гусиный шаг», не отрывая одну ступню от другой и от земли. Пройдите заново, чтобы закрепить.';
  else msg='Стоит вернуться к уроку. Ключ простой: безопасно то, что сближает ноги (гусиный шаг, не отрывая одну ступню от другой и от земли) и держит вас дальше 8 м от провода; опасно всё, что разводит ноги (широкий шаг, бег, перешагивание).';
  $('doneText').textContent=msg;
}

$('btnOk').addEventListener('click',()=>answer(true));
$('btnBad').addEventListener('click',()=>answer(false));
$('btnNext').addEventListener('click',next);
$('btnReset').addEventListener('click',start);
start();
</script>
</body>
</html>
