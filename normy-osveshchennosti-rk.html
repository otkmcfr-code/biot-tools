<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нормы освещённости рабочих мест и помещений — РК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#007760; --brand-d:#005c4a; --brand-tint:#e9f3f0; --brand-tint2:#f3f8f6;
    --ink:#16201d; --muted:#5c6b66; --faint:#8a9793;
    --line:#e0e6e3; --line-s:#cfd8d4; --bg:#f6f8f7; --card:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);
       -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:10px}
  /* stage / slide animation */
  .stage{position:relative;overflow:hidden}
  .screen{background:var(--card);border:.5px solid var(--line);border-radius:14px;overflow:hidden}
  .screen.in-right{animation:inR .28s cubic-bezier(.22,.61,.36,1)}
  .screen.in-left{animation:inL .28s cubic-bezier(.22,.61,.36,1)}
  @keyframes inR{from{transform:translateX(28px);opacity:.001}to{transform:none;opacity:1}}
  @keyframes inL{from{transform:translateX(-28px);opacity:.001}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.screen.in-right,.screen.in-left{animation:none}}
  /* header */
  .hdr{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
  .hdr .ttl{font-weight:600;font-size:15px;flex:1;min-width:0;line-height:1.25}
  .hdr .sub{display:block;font-weight:400;font-size:11.5px;color:#cde6df;margin-top:1px}
  .iconbtn{appearance:none;background:transparent;border:0;color:#fff;cursor:pointer;padding:6px;
           border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:rgba(255,255,255,.14)}
  .iconbtn:focus-visible{outline:2px solid #fff;outline-offset:1px}
  .iconbtn svg{width:22px;height:22px;display:block}
  /* crumbs */
  .crumbs{font-size:11.5px;color:var(--muted);padding:8px 14px;border-bottom:.5px solid var(--line);
          background:var(--brand-tint2);white-space:nowrap;overflow-x:auto}
  .crumbs b{color:var(--brand-d);font-weight:600}
  /* home */
  .home-hero{padding:16px 14px 6px}
  .home-hero h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  .home-hero p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .search{padding:12px 14px 4px;position:relative}
  .search input{width:100%;height:44px;border:.5px solid var(--line-s);border-radius:10px;
     padding:0 40px 0 40px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
  .search .si{position:absolute;left:24px;top:24px;color:var(--faint);pointer-events:none}
  .search .clr{position:absolute;right:22px;top:20px}
  .menu{padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .m-lbl{font-size:11.5px;color:var(--faint);font-weight:600;margin:6px 2px 0}
  /* row buttons */
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
       border:.5px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;
       font:inherit;color:var(--ink)}
  .row:hover{border-color:var(--brand);background:var(--brand-tint2)}
  .row:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .row .rt{flex:1;min-width:0}
  .row .rn{font-size:14.5px;font-weight:500;line-height:1.3}
  .row .rd{font-size:12px;color:var(--muted);margin-top:2px}
  .row .rc{color:var(--brand);flex-shrink:0}
  .row.cat .ri{width:34px;height:34px;border-radius:9px;background:var(--brand-tint);color:var(--brand-d);
       display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .list{padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
  .cnt{font-size:11px;color:var(--faint);font-weight:500;margin-left:6px}
  /* detail card */
  .detail{padding:14px}
  .d-name{font-size:17px;font-weight:600;line-height:1.3;margin:0 0 2px}
  .d-in{font-size:12px;color:var(--muted);margin-bottom:12px}
  .hero{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .hcard{background:var(--brand-tint);border-radius:12px;padding:11px 13px;flex:1;min-width:120px}
  .hcard .hl{font-size:11.5px;color:var(--brand-d);font-weight:500}
  .hcard .hv{font-size:29px;font-weight:700;color:var(--brand-d);line-height:1.05;margin-top:3px;
       font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .hcard .hv small{font-size:13px;font-weight:500}
  .hcard.alt{background:#eef1f0}
  .hcard.alt .hl{color:var(--muted)} .hcard.alt .hv{color:var(--ink)}
  .sect{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--brand-d)}
  .kv{width:100%;border-collapse:collapse;font-size:13.5px}
  .kv tr{border-top:.5px solid var(--line)}
  .kv tr:first-child{border-top:0}
  .kv td{padding:8px 0;vertical-align:top}
  .kv td.k{color:var(--muted);width:52%;padding-right:12px}
  .kv td.v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
  .rowblock{border:.5px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px}
  .rowblock .rbh{font-size:13px;font-weight:600;color:var(--ink);padding:8px 0 2px}
  .note{background:var(--brand-tint2);border:.5px solid var(--line);border-radius:10px;
        padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px}
  .note b{color:var(--ink)}
  /* collapsible */
  details.prim{margin-top:12px;border:.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  details.prim>summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13px;font-weight:500;
       color:var(--brand-d);display:flex;align-items:center;gap:8px}
  details.prim>summary::-webkit-details-marker{display:none}
  details.prim>summary .chev{transition:transform .2s;margin-left:auto;color:var(--faint)}
  details.prim[open]>summary .chev{transform:rotate(180deg)}
  .prim-body{padding:0 13px 12px;font-size:12.5px;color:var(--muted);line-height:1.55}
  .prim-body p{margin:0 0 7px} .prim-body p:last-child{margin:0}
  /* source */
  .src{margin-top:12px;padding-top:11px;border-top:.5px solid var(--line);
       font-size:11.5px;color:var(--faint);line-height:1.5}
  .src b{color:var(--muted);font-weight:600}
  /* empty */
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty svg{color:var(--line-s);margin-bottom:8px}
  .foot{padding:12px 14px 6px}
  .foot button{width:100%;background:#fff;border:.5px solid var(--line);border-radius:10px;
       padding:11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:8px}
  .foot button:hover{border-color:var(--brand);color:var(--brand-d)}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;
     background:var(--brand-tint);color:var(--brand-d);margin-top:3px}
  .info p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 10px}
  .info h4{font-size:13px;color:var(--brand-d);margin:14px 0 4px}
</style>
</head>

function cleanNum(v){v=(v||'').trim();return /^\d+(?:[.,]\d+)?(?:\s*\/\s*\d+(?:[.,]\d+)?)?$/.test(v)?v:'';}
function norm(s){return (s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();}

function groupBy(items,key){var m={},order=[];items.forEach(function(it){var g=it[key];if(!(g in m)){m[g]=[];order.push(g);}m[g].push(it);});return {m:m,order:order};}

    return rowBtn(label,d||null,'data-act="vitem" data-key="'+esc(razryad)+'" data-i="'+i+'"');
  }).join('');
  return '<div class="screen" id="scr">'+header('Разряд '+razryad,it.char)+crumbs(['Начало','По разряду','Разряд '+razryad])+'<div class="list">'+body+'</div><div style="height:8px"></div></div>';
}

function heroBlock(cards){
  var out=cards.filter(function(c){return c.v;}).map(function(c){
    return '<div class="hcard'+(c.alt?' alt':'')+'"><div class="hl">'+esc(c.l)+'</div><div class="hv">'+esc(c.v)+(c.u?' <small>'+esc(c.u)+'</small>':'')+'</div></div>';
  }).join('');
  return out?'<div class="hero">'+out+'</div>':'';
}
function primBlock(cat){
  return '<details class="prim"><summary>Примечания к таблице (по НПА) '+IC.chevd+'</summary><div class="prim-body">'
    +PRIM[cat].map(function(p){return '<p>'+p+'</p>';}).join('')+'</div></details>';
}
function srcBlock(cat){
  return '<div class="src"><b>Источник:</b> '+esc(SRC_MAIN)+' '+esc(TABLE_TITLE[cat])+'.<br>'+esc(DISCLAIMER)+'</div>';
}

function viewItemInd(id){
  var it=DATA.industrial.items.filter(function(x){return x.n===id;})[0];
  var s='<div class="detail"><div class="d-name">'+esc(it.name)+'</div><div class="d-in">'+esc(it.group)+' · <span class="badge">Промышленные</span></div>';
  it.rows.forEach(function(r,i){
    var multi=it.rows.length>1;
    if(multi)s+='<div class="rowblock">'+(r.surface?'<div class="rbh">'+esc(r.surface)+'</div>':'');
    if(i===0){s+=heroBlock([
      {l:'При общем освещении',v:cleanNum(r.eObsh),u:'лк'},
      {l:'Комбинир. (всего)',v:cleanNum(r.eKombTot),u:'лк',alt:true}
    ]);}
    s+='<table class="kv">'
      +kvRow('Рабочая поверхность, плоскость',r.surface)
      +kvRow('Разряд зрительной работы',r.razryad)
      +kvRow('Освещённость при общем, лк',r.eObsh)
      +kvRow('Комбинированное — всего, лк',r.eKombTot)
      +kvRow('Комбинированное — от общего, лк',r.eKombObsh)
      +kvRow('Показатель ослеплённости, не более',r.oslep)
      +kvRow('Коэффициент пульсации, %',r.puls)
      +'</table>';
    if(r.note)s+='<div class="note"><b>Указание:</b> '+esc(r.note)+'</div>';
    if(multi)s+='</div>';
  });
  s+=primBlock('industrial')+srcBlock('industrial')+'</div>';
  return '<div class="screen" id="scr">'+header(it.name.length>40?it.name.slice(0,38)+'…':it.name)+crumbs(['Начало','Промышленные',it.group.length>20?it.group.slice(0,18)+'…':it.group])+s+'</div>';
}

function viewItemPub(id){

  var s='<div class="detail"><div class="d-name">'+esc(it.name)+'</div><div class="d-in">'+esc(it.sphere)+' · <span class="badge">Общественные</span></div>';

    ]);}
    s+='<table class="kv">'

      +kvRow('Показатель дискомфорта, не более',r.disc)

      +kvRow('КЕО естеств.: боковое, %',r.keoNatSide)
      +kvRow('КЕО совмещ.: верхнее/комбинир., %',r.keoSovTop)

  return '<div class="screen" id="scr">'+header(it.name.length>40?it.name.slice(0,38)+'…':it.name)+crumbs(['Начало','Общественные',it.sphere.length>18?it.sphere.slice(0,16)+'…':it.sphere])+s+'</div>';

function viewItemVis(razryad,i){
  var it=DATA.visual.items.filter(function(x){return x.razryad===razryad;})[0];
  var r=it.sub[i];
  // КЕО at разряд level: take from any sub row that has it
  var kNT='',kNS='',kST='',kSS='';
  it.sub.forEach(function(x){if(x.keoNatTop)kNT=kNT||x.keoNatTop;if(x.keoNatSide)kNS=kNS||x.keoNatSide;if(x.keoSovTop)kST=kST||x.keoSovTop;if(x.keoSovSide)kSS=kSS||x.keoSovSide;});
  var s='<div class="detail"><div class="d-name">Разряд '+esc(razryad)+', подразряд '+esc(r.pod||('#'+(i+1)))+'</div>'
    +'<div class="d-in">'+esc(it.char)+' · размер объекта: '+esc(it.size||'—')+' мм</div>';
  s+=heroBlock([
    {l:'Комбинир. — всего',v:cleanNum(r.eKombTot),u:'лк'},
    {l:'При общем',v:cleanNum(r.eObsh),u:'лк',alt:true}
  ]);
  s+='<table class="kv">'
    +kvRow('Контраст объекта с фоном',r.contrast)
    +kvRow('Характеристика фона',r.bg)
    +kvRow('Комбинированное — всего, лк',r.eKombTot)
    +kvRow('Комбинированное — от общего, лк',r.eKombObsh)
    +kvRow('При системе общего освещения, лк',r.eObsh)
    +kvRow('Показатель ослеплённости P',r.oslepP)
    +kvRow('Коэффициент пульсации Kп, %',r.pulsKp)
    +'</table>';
  s+='<div class="sect">КЕО (нормируется на уровне разряда '+esc(razryad)+')</div>'
    +'<table class="kv">'
    +kvRow('Естеств.: верхнее/комбинир., %',kNT)
    +kvRow('Естеств.: боковое, %',kNS)
    +kvRow('Совмещ.: верхнее/комбинир., %',kST)
    +kvRow('Совмещ.: боковое, %',kSS)
    +'</table>';
  s+='<div class="note">Если в ячейке два значения — это варианты сочетаний контраста и фона и допустимых сочетаний показателя ослеплённости и коэффициента пульсации. Выбор — по фактическим условиям зрительной работы.</div>';
  s+=primBlock('visual')+srcBlock('visual')+'</div>';
  return '<div class="screen" id="scr">'+header('Разряд '+razryad+' · '+(r.pod||''))+crumbs(['Начало','По разряду','Разряд '+razryad,'Подразряд '+(r.pod||'')])+s+'</div>';
}

function viewInfo(){
  var s='<div class="detail info"><div class="d-name">О нормативах</div>'
   +'<p>Значения освещённости приведены по действующему законодательству Республики Казахстан. Первоисточник для всех показателей — '+esc(SRC_MAIN)+'</p>'
   +'<h4>Разделы инструмента</h4>'
   +'<p><b>Промышленные помещения</b> — Таблица 3 приложения 3 (склады, электропомещения, котельные, инженерные сети, автосервис).</p>'
   +'<p><b>Общественные, жилые, вспомогательные</b> — Таблица 4 приложения 3.</p>'
   +'<p><b>По разряду зрительной работы</b> — Таблица 2 приложения 3 (разряды I–VIII), для расчёта по размеру объекта различения, контрасту и фону.</p>'
   +'<h4>Связь с санитарными правилами</h4>'
   +'<p>Приказ МЗ РК от 03.08.2021 № ҚР ДСМ-72 (санитарные требования к производственным зданиям) по показателям освещённости на рабочих местах прямо отсылает к ДСМ-15 (п. 40, 77) и отдельно требует при работах средней точности комбинированную освещённость не менее 500 лк (п. 76).</p>'
   +'<div class="note"><b>Оговорка.</b> '+esc(DISCLAIMER)+' Настоящий инструмент носит справочный характер и не заменяет инструментальные замеры и заключение по результатам обследования.</div>'
   +'</div>';
  return '<div class="screen" id="scr">'+header('О нормативах')+crumbs(['Начало','О нормативах'])+s+'</div>';
}

// ---- search ----
function renderResults(qraw){
  var box=document.getElementById('results'),cats=document.getElementById('cats'),clr=document.querySelector('.clr');
  var q=norm(qraw);
  if(!q){box.innerHTML='';cats.style.display='';clr.style.display='none';postHeight();return;}
  clr.style.display='';cats.style.display='none';
  var res=INDEX.filter(function(x){return x.q.indexOf(q)>-1;}).slice(0,60);
  if(!res.length){box.innerHTML='<div class="empty">'+IC.search+'<div>Ничего не найдено по запросу «'+esc(qraw.trim())+'».<br>Попробуйте другое слово или выберите раздел.</div></div>';postHeight();return;}
  var badge={industrial:'Пром.',public:'Общ.',visual:'Разряд'};
  var html='<div class="list" style="padding-top:8px">';
  res.forEach(function(x){
    var act=x.cat==='visual'?('data-act="raz" data-key="'+esc(x.id)+'"'):('data-act="item" data-cat="'+x.cat+'" data-id="'+x.id+'"');
    html+='<button class="row" '+act+'><div class="rt"><div class="rn">'+esc(x.name)+'</div><div class="rd">'+esc(x.ctx)+' · '+badge[x.cat]+'</div></div><span class="rc">'+IC.chev+'</span></button>';
  });
  html+='</div>';
  box.innerHTML=html;postHeight();
}

// ---- dispatch ----
function render(dir){
  var v=current(),html;
  switch(v.v){
    case 'home':html=viewHome();break;
    case 'cat':html=viewCat(v.cat);break;
    case 'group':html=viewGroup(v.cat,v.key);break;
    case 'raz':html=viewRaz(v.key);break;
    case 'item':html=(v.cat==='industrial')?viewItemInd(v.id):viewItemPub(v.id);break;
    case 'vitem':html=viewItemVis(v.key,v.i);break;
    case 'info':html=viewInfo();break;
  }
  var stage=document.getElementById('stage');
  stage.innerHTML=html;
  var scr=document.getElementById('scr');
  scr.classList.add(dir==='left'?'in-left':'in-right');
  scr.addEventListener('animationend',function(){scr.classList.remove('in-left','in-right');postHeight();},{once:true});
  window.scrollTo(0,0);
  postHeight();
}

// event delegation
document.getElementById('stage').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='back')return back();
  if(a==='home')return home();
  if(a==='info')return push({v:'info'});
  if(a==='cat')return push({v:'cat',cat:t.getAttribute('data-cat')});
  if(a==='grp')return push({v:'group',cat:t.getAttribute('data-cat'),key:t.getAttribute('data-key')});
  if(a==='raz')return push({v:'raz',key:t.getAttribute('data-key')});
  if(a==='item')return push({v:'item',cat:t.getAttribute('data-cat'),id:parseInt(t.getAttribute('data-id'),10)});
  if(a==='vitem')return push({v:'vitem',key:t.getAttribute('data-key'),i:parseInt(t.getAttribute('data-i'),10)});
  if(a==='clr'){var q=document.getElementById('q');q.value='';q.focus();renderResults('');}
});
document.getElementById('stage').addEventListener('input',function(e){
  if(e.target && e.target.id==='q')renderResults(e.target.value);
});
document.getElementById('stage').addEventListener('toggle',function(e){postHeight();},true);

// ---- height to parent ----
var lastH=0;
function postHeight(){
  requestAnimationFrame(function(){
    var h=document.documentElement.getBoundingClientRect().height;
    h=Math.ceil(h)+2;
    if(h!==lastH){lastH=h;try{parent.postMessage({type:HEIGHT_MSG,height:h},'*');}catch(e){}}
  });
}
window.addEventListener('resize',postHeight);
window.addEventListener('load',postHeight);

render('right');
})();
</script>
