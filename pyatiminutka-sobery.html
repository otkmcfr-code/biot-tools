<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Собери пятиминутку</title><style>
:root{--bg:#F2F6F5;--card:#FFFFFF;--soft:#E9F0EE;--line:#D3DFDB;--ink:#15302A;--muted:#566B65;
--acc:#0E6B5C;--acc-ink:#FFFFFF;--acc-soft:#DCEEE9;--ok:#1E7A3C;--ok-soft:#E1F3E6;--bad:#B3261E;--bad-soft:#FBE4E2;--warn:#9A4A12;--warn-soft:#FBEBDD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1917;--card:#15221F;--soft:#1B2B27;--line:#2A3D38;--ink:#E3EDEA;--muted:#98ADA7;
--acc:#52C2A8;--acc-ink:#08201B;--acc-soft:#1C3832;--ok:#7FD69A;--ok-soft:#173323;--bad:#F28B82;--bad-soft:#3B201E;--warn:#F0A76B;--warn-soft:#3A2A1C}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1917;--card:#15221F;--soft:#1B2B27;--line:#2A3D38;--ink:#E3EDEA;--muted:#98ADA7;
--acc:#52C2A8;--acc-ink:#08201B;--acc-soft:#1C3832;--ok:#7FD69A;--ok-soft:#173323;--bad:#F28B82;--bad-soft:#3B201E;--warn:#F0A76B;--warn-soft:#3A2A1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 18px}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font-size:20px;line-height:1.2;margin:4px 0 6px}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.prog{flex:1;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.situ{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.phrase{font-size:16px;font-weight:600;line-height:1.35}
.say{position:relative;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.who{font-size:12px;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:7px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.grid5{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.grid5 .opt:last-child{grid-column:1/-1}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.score{font-size:28px;font-weight:700;color:var(--acc)}
.list{margin:8px 0 0;padding-left:20px}.list li{margin:4px 0}
.step{font-size:11.5px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:8px}
.acts{display:grid;gap:5px;margin-top:6px}
.act{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-size:13.5px;cursor:pointer;line-height:1.3}
button.act:hover:not(:disabled){border-color:var(--acc)}
.act .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.act.on .n{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.act.on{border-color:var(--acc)}
.act.ok{border-color:var(--ok);background:var(--ok-soft)}
.act.bad{border-color:var(--bad);background:var(--bad-soft)}
.act.miss{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.act .why{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.note{font-size:12px;color:var(--muted);margin-top:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head>
<body><div class="wrap">
<div class="eyebrow">Тренажёр · Пятиминутка по безопасности</div>
<h1>Собери пятиминутку</h1>
<p class="lede">Разложите фразы по четырём шагам пятиминутки. Лишние – отбросьте.</p>
<div id="app"></div>
</div>
<script>
(function(){"use strict";
const DATA=[{"name": "На производстве", "situ": "Мороз −25 °С и ветер, бригада работает на открытой площадке. Мастер проводит встречу перед сменой.", "items": [{"t": "Сегодня до минус двадцати пяти и ветер, работаем на открытой площадке.", "cat": 1, "why": "Это связь с сегодняшним днём: работники сразу понимают, почему тема важна именно сейчас."}, {"t": "Идём греться по графику, даже если кажется, что не замёрзли. Промокли перчатки – меняем сразу.", "cat": 2, "why": "Главное сказано через конкретные действия: что делать и когда."}, {"t": "Как понять, что коллега начинает замерзать?", "cat": 3, "why": "На такой вопрос нужно ответить по существу – так видно, поняли ли тему."}, {"t": "Греемся в десять и в двенадцать, перчатки меняем сразу.", "cat": 4, "why": "Короткое действие на сегодня – его запоминают лучше всего."}, {"t": "Работникам необходимо не допускать переохлаждения организма.", "cat": 0, "short": "канцелярская фраза без конкретного действия", "why": "Канцелярская фраза ни к кому не обращена: с ней все согласятся, но непонятно, что именно делать."}, {"t": "В прошлом году на соседнем заводе человек лишился пальцев – вот фотографии.", "cat": 0, "short": "запугивание без понятного действия", "why": "Запугивание часто даёт обратный эффект: одни отворачиваются, другие считают, что с ними такого не случится."}, {"t": "Всем понятно? Тогда за работу.", "cat": 0, "short": "на такой вопрос всегда отвечают «да»", "why": "На «всем понятно?» всегда отвечают «да» – вопрос не показывает, усвоена ли тема."}]}, {"name": "В офисе", "situ": "Волна простуд в отделе. Руководитель начинает утреннюю планёрку.", "items": [{"t": "В отделе уже трое на больничном.", "cat": 1, "why": "Одна фраза о ситуации в коллективе – и тема сразу становится актуальной для всех."}, {"t": "Если утром температура или озноб – напишите мне до начала рабочего дня и оставайтесь дома, задачи перераспределим.", "cat": 2, "why": "Названы конкретные действия и снят страх последствий: задачи перераспределят."}, {"t": "Кому и как сообщать, если утром почувствовали себя плохо?", "cat": 3, "why": "Вопрос по существу: ответ покажет, знают ли работники порядок."}, {"t": "Проветриваем кабинет в каждый перерыв.", "cat": 4, "why": "Одно понятное действие на сегодня."}, {"t": "Сотрудникам рекомендуется соблюдать меры профилактики ОРВИ.", "cat": 0, "short": "общая формулировка", "why": "Из такой фразы непонятно, что именно нужно сделать."}, {"t": "Распишитесь в журнале, что ознакомлены с памяткой.", "cat": 0, "short": "подпись – не результат", "why": "Подпись подтверждает ознакомление, но не то, что человек понял и будет выполнять."}, {"t": "Вопросы есть? Нет? Расходимся.", "cat": 0, "short": "пустой вопрос", "why": "Такой вопрос не превращает монолог в разговор и не показывает, поняли ли тему."}]}];
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c;}

const STEPS=[[1,"Шаг 1","Связь с сегодняшним днём"],[2,"Шаг 2","Главное и действия"],[3,"Шаг 3","Вопрос"],[4,"Шаг 4","Действие на сегодня"],[0,"Лишнее","Не подходит для пятиминутки"]];
let sc=0,order=[],i=0,right=0,ans={};
function start(k){sc=k;order=shuffle(DATA[k].items.map((_,n)=>n));i=0;right=0;ans={};draw();}
function tabs(){return '<div class="tabs" role="group" aria-label="Ситуация">'+DATA.map((s,k)=>'<button class="tab" data-k="'+k+'" aria-pressed="'+(k===sc)+'">'+esc(s.name)+'</button>').join("")+'</div>';}
function bindTabs(){document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>start(+b.dataset.k));}
function draw(){
  const S=DATA[sc],n=order.length;
  if(i>=n) return finish();
  const it=S.items[order[i]],done=ans[order[i]]!==undefined;
  let h=tabs()+'<div class="bar"><span>Фраза '+(i+1)+' из '+n+'</span><span class="prog"><i style="width:'+(i/n*100)+'%"></i></span></div>';
  h+='<div class="card"><p class="situ">'+esc(S.situ)+'</p><div class="who">Куда отнести фразу?</div><div class="phrase">«'+esc(it.t)+'»</div><div class="grid5">';
  h+=STEPS.map(([v,a,b])=>{let c="";if(done){if(v===it.cat)c=" ok";else if(v===ans[order[i]])c=" bad";else c=" dim";}
    return '<button class="opt'+c+'" data-v="'+v+'"'+(done?" disabled":"")+'><b>'+a+'</b><small>'+b+'</small></button>';}).join("");
  h+='</div>';
  if(done){const ok=ans[order[i]]===it.cat;h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"Верно.":"Не совсем.")+'</b>'+esc(it.why)+'</div><div class="row"><button class="btn" id="next">'+(i+1<n?"Дальше":"Посмотреть пятиминутку")+'</button></div>';}
  h+='</div>';
  $("app").innerHTML=h;bindTabs();
  document.querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{ans[order[i]]=+b.dataset.v;if(+b.dataset.v===it.cat)right++;draw();});
  const nx=$("next");if(nx){nx.onclick=()=>{i++;draw();};nx.focus();}
}
function finish(){
  const S=DATA[sc],n=S.items.length;
  let h=tabs()+'<div class="card"><div class="score">'+right+' из '+n+'</div><div class="who">'+(right===n?"Отлично: все фразы на своих местах.":"Сравните с правильным вариантом ниже.")+'</div>';
  h+='<p style="margin:12px 0 4px;font-weight:700">Как звучит пятиминутка целиком</p>';
  [1,2,3,4].forEach(s=>{const its=S.items.filter(x=>x.cat===s);h+='<span class="step">'+STEPS[s-1][1]+' · '+STEPS[s-1][2]+'</span>'+its.map(x=>'<div>«'+esc(x.t)+'»</div>').join("");});
  const extra=S.items.filter(x=>x.cat===0);
  h+='<p style="margin:12px 0 4px;font-weight:700">Что не стоит говорить</p><ul class="list">'+extra.map(x=>'<li>«'+esc(x.t)+'» – '+esc(x.short)+'</li>').join("")+'</ul>';
  const other=(sc+1)%DATA.length;
  h+='<div class="row"><button class="btn" id="again">Пройти ещё раз</button><button class="btn ghost" id="other">'+esc(DATA[other].name)+'</button></div></div>';
  $("app").innerHTML=h;bindTabs();$("again").onclick=()=>start(sc);$("other").onclick=()=>start(other);
}
start(0);

})();
</script>
<script>
(function(){function send(){parent.postMessage({type:"biot-height",id:"pyatiminutka-sobery",height:document.body.scrollHeight},"*");}
new ResizeObserver(send).observe(document.body);window.addEventListener("load",send);})();
</script>
</body></html>
