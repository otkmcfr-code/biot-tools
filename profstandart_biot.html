<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигатор по профстандарту БиОТ</title>
<style>
:root{
  --ink:#1c2433; --muted:#5d6678; --faint:#8a92a3; --line:#e2e6ec; --bg:#f4f6f8; --card:#fff;
  --accent:#0d6b6b; --accent-2:#0a5555; --accent-soft:#e3f1f0;
  --yes:#1f8a5b; --yes-soft:#e3f4ec; --part:#c07a00; --part-soft:#fbf0dc; --no:#c2413b; --no-soft:#fbe7e5;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:800px;margin:0 auto;height:100vh;max-height:1000px;display:flex;flex-direction:column;background:var(--bg)}
header.top{padding:14px 16px 10px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
main{flex:1 1 auto;overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
footer.nav{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:14px}
.link:hover{text-decoration:underline}
.eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:0 0 2px}
h1{font-size:19px;line-height:1.25;margin:2px 0 0}
h2{font-size:16px;line-height:1.3;margin:0}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:border-color .15s,box-shadow .15s}
.tile:not([disabled]):hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(13,107,107,.12)}
.tile[disabled]{cursor:default;opacity:.62}
.tile .name{font-weight:600;font-size:14px;line-height:1.3}
.tile .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent-2);white-space:nowrap}
.badge.grey{background:#eef0f3;color:var(--muted)}
.intro{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.intro b{color:var(--ink)}

/* segmented / tabs */
.seg{display:flex;background:#eef0f3;border-radius:8px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 4px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:18px;margin-top:10px;border-bottom:1px solid var(--line);margin-bottom:-11px}
.tabs button{border:0;background:none;padding:8px 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

/* matrix */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tf{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px 12px;margin-bottom:10px}
.tf-head{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.tf-num{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;margin-top:1px}
.tf-title{font-size:13.5px;font-weight:600;line-height:1.3}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill{position:relative;border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:9px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:border-color .15s,background .15s}
.skill:hover{border-color:var(--accent);background:#fff}
.skill .k{font-size:11px;font-weight:600;color:var(--accent-2);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.skill .t{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.skill .c{margin-top:auto;font-size:11.5px;color:var(--faint)}
.rec{display:inline-block;width:9px;height:9px;transform:rotate(45deg);background:var(--accent);border-radius:1px}
.rec.no{background:none;border:1.5px solid #b9c0cb}
.bar{display:flex;height:4px;border-radius:3px;overflow:hidden;background:#e8ebef}
.bar i{display:block;height:100%}
.bar .y{background:var(--yes)} .bar .p{background:var(--part)} .bar .n{background:var(--no)}
.skill .bar{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:3px}

/* skill view */
.crumbs{font-size:12.5px;color:var(--muted)}
.skill-tf{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);background:none;border:0;padding:0}
.switch .tr{width:34px;height:20px;border-radius:20px;background:#cfd5dd;position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"] .tr{background:var(--accent)}
.switch[aria-checked="true"] .tr::after{left:16px}
ol.items{list-style:none;margin:0;padding:0;counter-reset:it}
ol.items li{counter-increment:it;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px 9px 38px;margin-bottom:7px;position:relative;font-size:14px}
ol.items li::before{content:counter(it);position:absolute;left:10px;top:9px;width:20px;height:20px;border-radius:50%;background:#eef0f3;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.items li.v-y{border-color:#bfe3d0;background:#f6fbf8}
ol.items li.v-p{border-color:#f0d9a8;background:#fffaf0}
ol.items li.v-n{border-color:#efc2bf;background:#fff7f6}
.marks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.marks button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.marks button:hover{border-color:#b9c0cb}
.marks button.on.y{background:var(--yes);border-color:var(--yes);color:#fff}
.marks button.on.p{background:var(--part);border-color:var(--part);color:#fff}
.marks button.on.n{background:var(--no);border-color:var(--no);color:#fff}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13.5px}
.navbtn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.navbtn[disabled]{opacity:.4;cursor:default}
.pos{font-size:12.5px;color:var(--muted);flex:1;text-align:center}

/* passport */
.pp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}
.pp dl{margin:0}
.pp .it{padding:10px 0;border-bottom:1px solid var(--line)}
.pp .it:last-child{border-bottom:0}
.pp dt{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.pp dd{margin:0;font-size:14px}
.pp ul{margin:0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;background:#eef0f3;border-radius:20px;padding:3px 9px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
details p{font-size:13px;color:var(--muted);margin:6px 0 0}

/* results */
.sum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.sum .big{font-size:26px;font-weight:700;line-height:1}
.sum .bar{height:8px;margin-top:10px}
.keys{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.keys i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tfr{display:grid;grid-template-columns:44px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.tfr:last-child{border-bottom:0}
.tfr .bar{height:7px}
.tfr .pc{text-align:right;color:var(--muted)}
.gap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.gap h3{font-size:13px;margin:0 0 6px;line-height:1.3}
.gap h3 .link{font-size:13px;text-align:left}
.gap ul{margin:0;padding:0;list-style:none}
.gap li{font-size:13px;padding:3px 0 3px 16px;position:relative}
.gap li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%}
.gap li.p::before{background:var(--part)} .gap li.n::before{background:var(--no)}
.gap .tp{font-size:11px;color:var(--faint);text-transform:uppercase;margin-right:4px}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.actions{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font-size:13.5px}
.btn.ghost{background:#fff;color:var(--accent)}
.note{font-size:12px;color:var(--faint);margin-top:8px}
h4.sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 8px}
.print-only{display:none}
details.warn{margin-top:6px;font-size:12.5px}
details.warn summary{color:var(--part);font-size:12.5px}
details.warn p{background:var(--part-soft);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:12.5px;margin:5px 0 0}
details.warn.card{background:var(--card);border:1px solid #f0d9a8;border-radius:var(--radius);padding:8px 12px;margin:0 0 12px}
details.warn.card summary{font-weight:600}
.inote{font-size:12px;color:var(--part);margin-top:4px}

@media (max-width:420px){
  .skills{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .tile{min-height:0}
  h1{font-size:17px}
  .tabs{gap:14px}
  header.top h2{font-size:15px}
  .recline{margin-top:6px}
}
@media print{
  html,body{background:#fff}
  .app{height:auto;max-height:none}
  header.top .seg,header.top .tabs,footer.nav,.actions,.note,.no-print{display:none!important}
  main{overflow:visible}
  .print-only{display:block}
  .gap,.sum{break-inside:avoid}
}
</style>
</head>

(function(){
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n,f){const a=n%10,b=n%100;return f[(a==1&&b!=11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]}
const store={
  mem:{},
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return this.mem[k]||null}},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const params=new URLSearchParams(location.search);
const S={view:'home',card:null,cat:null,tab:'matrix',si:0,part:'abilities',assess:false};
const fromParam=params.get('card');
if(fromParam){const c=DATA.cards.find(c=>String(c.id)===fromParam&&c.categories);if(c){S.view='card';S.card=c;S.cat=c.categories[0].code}}
let marks={};
function mkey(){return 'profstd490:'+S.card.id}
function loadMarks(){marks=store.get(mkey())||{}}
function saveMarks(){store.set(mkey(),marks)}
const cat=()=>S.card.categories.find(c=>c.code===S.cat);
function flat(){const out=[];cat().functions.forEach(f=>f.skills.forEach(s=>out.push({f,s})));return out}
const iid=(f,s,part,i)=>S.cat+'/'+f.n+'/'+s.n+'/'+(part==='abilities'?'a':'k')+i;
function stats(list){let y=0,p=0,n=0,t=0;list.forEach(({f,s})=>{['abilities','knowledge'].forEach(part=>s[part].forEach((_,i)=>{t++;const v=marks[iid(f,s,part,i)];if(v==='y')y++;else if(v==='p')p++;else if(v==='n')n++}))});return{y,p,n,t}}
function bar(st){if(!st.t)return '';const w=x=>(x/st.t*100).toFixed(2)+'%';return `<div class="bar"><i class="y" style="width:${w(st.y)}"></i><i class="p" style="width:${w(st.p)}"></i><i class="n" style="width:${w(st.n)}"></i></div>`}
const tfLabel=f=>f.extra?'Доп. ТФ':'ТФ '+f.n;
const recIcon=r=>r==='yes'?'<span class="rec" title="Возможность признания навыка: рекомендуется"></span>':r==='no'?'<span class="rec no" title="Возможность признания навыка: не рекомендуется"></span>':'';

function render(){
  if(S.view==='home')return renderHome();
  loadMarks();
  if(S.view==='skill')return renderSkill();
  renderCard();
}

function renderHome(){
  app.innerHTML=`<header class="top"><p class="eyebrow">Навигатор по профстандарту</p><h1>«Безопасность и охрана труда»</h1><div class="sub">${esc(DATA.source)}</div></header>
  <main><div class="intro">Выберите должность — откроется <b>матрица</b> трудовых функций и навыков с умениями и знаниями, <b>паспорт</b> требований и <b>самооценка</b>.</div>
  <div class="tiles">${DATA.cards.map(c=>`<button class="tile" data-card="${c.id}" ${c.categories?'':'disabled'}><span class="name">${esc(c.name)}</span><span class="meta"><span class="badge">ОРК ${esc(c.ork)}</span>${c.categories?'<span>Открыть →</span>':'<span class="badge grey">готовится</span>'}</span></button>`).join('')}</div></main>`;
  app.querySelectorAll('.tile:not([disabled])').forEach(b=>b.onclick=()=>{S.card=DATA.cards.find(c=>String(c.id)===b.dataset.card);S.cat=S.card.categories[0].code;S.view='card';S.tab='matrix';render()});
}

function cardHeader(){
  const c=S.card;
  return `<header class="top"><button class="link" data-act="home">← Все должности</button>
  <h1 style="margin-top:6px">${esc(c.name)}</h1>
  <div class="sub">Уровень ОРК ${esc(c.ork)}${c.categories.length>1?' · выберите категорию':''}</div>
  ${c.categories.length>1?`<div class="seg" role="group" aria-label="Категория">${c.categories.map(k=>`<button data-cat="${k.code}" aria-pressed="${k.code===S.cat}">${esc(k.name)}</button>`).join('')}</div>`:''}
  <div class="tabs" role="tablist">${[['matrix','Матрица'],['passport','Паспорт'],['results','Самооценка']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div></header>`;
}
function bindHeader(){
  app.querySelectorAll('[data-act=home]').forEach(b=>b.onclick=()=>{S.view='home';render()});
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
}

function renderCard(){
  let body='';
  if(S.tab==='matrix')body=matrixHTML();
  else if(S.tab==='passport')body=passportHTML();
  else body=resultsHTML();
  app.innerHTML=cardHeader()+`<main id="main">${body}</main>`;
  bindHeader();
  app.querySelectorAll('[data-si]').forEach(b=>b.onclick=()=>{S.si=+b.dataset.si;if(b.dataset.part)S.part=b.dataset.part;S.view='skill';render()});
  const pr=app.querySelector('[data-act=print]');if(pr)pr.onclick=()=>window.print();
  const rs=app.querySelector('[data-act=reset]');if(rs)rs.onclick=()=>{if(confirm(cat().name?'Сбросить все отметки самооценки для категории «'+cat().name+'»?':'Сбросить все отметки самооценки по этой должности?')){Object.keys(marks).forEach(k=>{if(k.startsWith(S.cat+'/'))delete marks[k]});saveMarks();render()}};
  const ga=app.querySelector('[data-act=go-assess]');if(ga)ga.onclick=()=>{S.assess=true;S.si=0;S.part='abilities';S.view='skill';render()};
}

function matrixHTML(){
  const k=cat();let si=0;
  const nA=k.functions.reduce((a,f)=>a+f.skills.length,0);
  const cn=(S.card.notes||[]).map(n=>`<details class="warn card"><summary>Примечание к тексту стандарта</summary><p>${esc(n)}</p></details>`).join('');
  const nTF=k.functions.filter(f=>!f.extra).length;
  return cn+`<div class="legend"><span>${nTF} ${plural(nTF,['трудовая функция','трудовые функции','трудовых функций'])}${k.functions.some(f=>f.extra)?' + дополнительная':''} · ${nA} ${plural(nA,['навык','навыка','навыков'])}</span><span><span class="rec"></span>признание навыка рекомендуется</span><span><span class="rec no"></span>не рекомендуется</span></div>`+
  k.functions.map((f,fi)=>`<section class="tf"><div class="tf-head"><span class="tf-num">${tfLabel(f)}</span><div><div class="tf-title">${esc(f.title)}</div>${f.note?`<details class="warn"><summary>Примечание к тексту стандарта</summary><p>${esc(f.note)}</p></details>`:''}</div></div>
   <div class="skills">${f.skills.map(s=>{const st=stats([{f,s}]);const idx=si++;return `<button class="skill" data-si="${idx}" data-part="abilities" title="${esc(s.title)}"><span class="k">Навык ${s.n} ${recIcon(s.recognition)}</span><span class="t">${esc(s.title)}</span><span class="c">${s.abilities.length} ${plural(s.abilities.length,['умение','умения','умений'])} · ${s.knowledge.length} ${plural(s.knowledge.length,['знание','знания','знаний'])}</span>${(st.y+st.p+st.n)?bar(st):''}</button>`}).join('')}</div></section>`).join('')+
  (S.card.categories.length>1?`<p class="note">Номера трудовых функций — как в тексте стандарта (у инженера сквозная нумерация ТФ 1–15 для трёх категорий).</p>`:'');
}

function passportHTML(){
  const k=cat();
  const body=k.passport.map(p=>{let v;
    if(p.kind==='chips')v=`<div class="chips">${p.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
    else if(p.kind==='details')v=`<details><summary>Показать требования</summary>${p.items.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`;
    else if(p.kind==='ork'){const i=p.items.indexOf('Подуровни: ');v=esc(p.items[0])+(i>0?`<div style="font-size:13px;color:var(--muted);margin-top:4px">Подуровни:</div><ul>${p.items.slice(i+1).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')}
    else if(p.items.length>1)v=`<ul>${p.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    else v=esc(p.items[0]);
    return `<div class="it"><dt>${esc(p.label)}</dt><dd>${v}</dd></div>`}).join('');
  const cn=(S.card.notes||[]).map(n=>`<details class="warn card" open><summary>Примечание к тексту стандарта</summary><p>${esc(n)}</p></details>`).join('');
  return cn+`<div class="pp"><dl>${body}</dl></div>`;
}

function resultsHTML(){
  const k=cat(),all=flat(),st=stats(all),done=st.y+st.p+st.n;
  const head=`<div class="print-only"><h2>Самооценка по профстандарту «Безопасность и охрана труда»</h2><p>${esc(S.card.name)}${k.name?' — '+esc(k.name):''} · ${new Date().toLocaleDateString('ru-RU')}</p></div>`;
  if(!done)return head+`<div class="empty">Вы ещё ничего не отметили.<br>Пройдите навыки по порядку и отметьте для каждого умения и знания: <b>умею / частично / не умею</b>.<div class="actions" style="justify-content:center"><button class="btn" data-act="go-assess">Начать самооценку</button></div></div><p class="note">Отметки сохраняются только в этом браузере и никуда не отправляются.</p>`;
  const pct=Math.round((st.y+st.p*0.5)/done*100);
  let tfRows=k.functions.map((f,fi)=>{const s=stats(f.skills.map(s=>({f,s})));const dn=s.y+s.p+s.n;const p=dn?Math.round((s.y+s.p*0.5)/dn*100)+'%':'—';return `<div class="tfr"><span>${f.extra?'Доп.':'ТФ '+f.n}</span>${bar(s)}<span class="pc">${p}</span></div>`}).join('');
  let gaps='';let idx=0;
  k.functions.forEach((f,fi)=>f.skills.forEach(s=>{const my=idx++;const li=[];['abilities','knowledge'].forEach(part=>s[part].forEach((t,i)=>{const v=marks[iid(f,s,part,i)];if(v==='n'||v==='p')li.push(`<li class="${v}"><span class="tp">${part==='abilities'?'умение':'знание'}</span>${esc(t)}</li>`)}));
    if(li.length)gaps+=`<div class="gap"><h3><button class="link" data-si="${my}">${tfLabel(f)} · Навык ${s.n}: ${esc(s.title)}</button></h3><ul>${li.join('')}</ul></div>`}));
  return head+`<div class="sum"><div class="row"><div><div class="big">${pct}%</div><div class="sub" style="margin-top:4px">уровень соответствия по отмеченным пунктам</div></div><span class="spacer"></span><div style="text-align:right;font-size:13px;color:var(--muted)">Отмечено<br><b style="color:var(--ink)">${done} из ${st.t}</b></div></div>${bar(st)}
  <div class="keys"><span><i style="background:var(--yes)"></i>умею / знаю — ${st.y}</span><span><i style="background:var(--part)"></i>частично — ${st.p}</span><span><i style="background:var(--no)"></i>не умею / не знаю — ${st.n}</span><span><i style="background:#e8ebef"></i>не отмечено — ${st.t-done}</span></div></div>
  <h4 class="sec">По трудовым функциям</h4><div class="sum" style="padding:4px 14px">${tfRows}</div>
  <h4 class="sec">Что подтянуть</h4>${gaps||'<div class="empty">Пробелов среди отмеченных пунктов нет.</div>'}
  <div class="actions"><button class="btn" data-act="print">Печать / сохранить в PDF</button><button class="btn ghost" data-act="go-assess">Продолжить отмечать</button><span class="spacer"></span><button class="link" data-act="reset" style="color:var(--no)">Сбросить</button></div>
  <p class="note">Процент считается так: «умею» — 1, «частично» — 0,5, «не умею» — 0, по отмеченным пунктам. Отметки сохраняются только в этом браузере и никуда не отправляются.</p>`;
}

function renderSkill(){
  const list=flat(),{f,s}=list[S.si],fi=cat().functions.indexOf(f);
  const part=S.part,items=s[part];
  const lab=part==='abilities'?['Умею','Частично','Не умею']:['Знаю','Частично','Не знаю'];
  const recTxt=s.recognition==='yes'?'рекомендуется':s.recognition==='no'?'не рекомендуется':'не указана в стандарте';
  app.innerHTML=`<header class="top"><div class="row"><button class="link" data-act="back">← Матрица</button><span class="spacer"></span>
   <button class="switch" role="switch" aria-checked="${S.assess}" data-act="assess"><span>Самооценка</span><span class="tr"></span></button></div>
   <div class="crumbs" style="margin-top:8px">${esc(S.card.categories.length>1?cat().name+' · ':'')}${tfLabel(f)} · Навык ${s.n}</div>
   <h2 style="margin-top:3px">${esc(s.title)}</h2>
   <div class="skill-tf" title="${esc(f.title)}">${tfLabel(f)}: ${esc(f.title)}</div>${f.note?'<div class="recline" style="color:var(--part)">⚠ Наименование ТФ уточнено — см. примечание в матрице</div>':''}
   <div class="recline">${recIcon(s.recognition)} Возможность признания навыка: ${recTxt}</div>
   <div class="seg" role="tablist">${[['abilities','Умения',s.abilities.length],['knowledge','Знания',s.knowledge.length]].map(([k,l,n])=>`<button data-part="${k}" aria-pressed="${part===k}">${l} · ${n}</button>`).join('')}</div></header>
  <main><ol class="items">${items.map((t,i)=>{const v=marks[iid(f,s,part,i)]||'';const nt=s.notes&&s.notes[(part==='abilities'?'a':'k')+i];return `<li class="${v?'v-'+v:''}">${esc(t)}${nt?`<div class="inote">⚠ ${esc(nt)}</div>`:''}${S.assess?`<div class="marks">${['y','p','n'].map((m,j)=>`<button class="${m}${v===m?' on':''}" data-i="${i}" data-m="${m}">${lab[j]}</button>`).join('')}</div>`:''}</li>`}).join('')}</ol>
  ${S.assess&&part==='abilities'&&s.knowledge.length?`<div class="actions"><button class="btn ghost" data-part="knowledge">Дальше: знания →</button></div>`:''}
  ${!S.assess?`<p class="note">Включите «Самооценку» вверху, чтобы отметить, что вы уже умеете и знаете. Итог — на вкладке «Самооценка» в матрице.</p>`:''}</main>
  <footer class="nav"><button class="navbtn" data-act="prev" ${S.si===0?'disabled':''}>‹ Назад</button><span class="pos">Навык ${S.si+1} из ${list.length}</span><button class="navbtn" data-act="next" ${S.si===list.length-1?'disabled':''}>Далее ›</button></footer>`;
  app.querySelector('[data-act=back]').onclick=()=>{S.view='card';render()};
  app.querySelector('[data-act=assess]').onclick=()=>{S.assess=!S.assess;render()};
  app.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{S.part=b.dataset.part;render()});
  const go=d=>{S.si+=d;S.part='abilities';render()};
  const pv=app.querySelector('[data-act=prev]'),nx=app.querySelector('[data-act=next]');
  pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
  app.querySelectorAll('.marks button').forEach(b=>b.onclick=()=>{const k=iid(f,s,part,+b.dataset.i);if(marks[k]===b.dataset.m)delete marks[k];else marks[k]=b.dataset.m;saveMarks();
    const li=b.closest('li');li.className=marks[k]?'v-'+marks[k]:'';li.querySelectorAll('button').forEach(x=>x.classList.toggle('on',marks[k]===x.dataset.m))});
}

document.addEventListener('keydown',e=>{if(S.view!=='skill'||e.target.closest('input,textarea'))return;const n=flat().length;
  if(e.key==='ArrowRight'&&S.si<n-1){S.si++;S.part='abilities';render()}
  if(e.key==='ArrowLeft'&&S.si>0){S.si--;S.part='abilities';render()}});
render();
})();
</script>
</body>
</html>
